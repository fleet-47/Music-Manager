min_version = "2026.10.4" # first release that accepts `secrets` on tasks

[settings]
experimental = true        # mise secrets is experimental
task.output = "interleave" # no task-name prefixes
task.quiet = true          # no `[task] $ command` echo or skip notices

[tools]
spotify-downloader = "latest"
"conda:ffmpeg" = "latest"
deno = "latest"   # JS runtime yt-dlp needs for YouTube
yt-dlp = "latest"
fnox = "latest"   # mise's secrets source
bitwarden = "latest" # bw CLI, used by fnox's Bitwarden provider (only for `fnox sync`)
"github:remko/age-plugin-se" = { version = "latest", asset_pattern = "age-plugin-se-v*-macos.zip" } # Secure Enclave (Touch ID) key for fnox's sync cache
rclone = "latest"    # bisync for snowsky-sync

[vars]
snowsky_uuid = "D72A59AE-7803-3CC9-A912-80C68A492633" # Snowsky SD card (FAT32 volume UUID)
snowsky_root = "/Volumes/NO NAME"
spotify_list = "lists/spotify.spotdl"
spotify_output = "library/Spotify/{list-name}/{artists} - {title}.{output-ext}"

# Spotify credentials come from Bitwarden via fnox (.fnox.toml). Only spotify:list receives them.
[secrets.fnox]

# Per-device link to the music root; everything writes through it.
[tasks.library]
description = "Ask for the music root (default ~/Music) and create the library symlink to it on this device"
hide = true
interactive = true
skip_if = "test -L library"
run = '''
#!/usr/bin/env bash
read -r -p "Music root [~/Music]: " root
root="${root:-$HOME/Music}"
root="${root/#\~/$HOME}"
ln -s "$root" library
'''

# One link (track or playlist). Spotify -> download:spotify, anything else -> download:web.
[tasks.download]
description = "Download one track or playlist link (Spotify, SoundCloud, YouTube, ...) into library/<Source>/"
interactive = true
run = '''
#!/usr/bin/env bash
read -r -p "Link: " url
case "$url" in
  *open.spotify.com*) mise run download:spotify "$url" ;;
  *) mise run download:web "$url" ;;
esac
'''

# Step 1 of every Spotify download: one cheap listing call through the dev app (the only use of the secrets).
[tasks."spotify:list"]
description = "Write the track list for Spotify queries to lists/spotify.spotdl via the dev app"
hide = true
usage = 'arg "<query>" var=#true help="Spotify URLs, or saved / all-user-playlists"'
secrets = ["SPOTIFY_CLIENT_ID", "SPOTIFY_CLIENT_SECRET"]
run = '''
#!/usr/bin/env bash
eval "queries=($usage_query)"
mkdir -p "$(dirname "{{ vars.spotify_list }}")"
spotify-downloader save "${queries[@]}" --user-auth --no-cache \
  --client-id "$SPOTIFY_CLIENT_ID" --client-secret "$SPOTIFY_CLIENT_SECRET" \
  --save-file "{{ vars.spotify_list }}"
'''

# Step 2: download from the list with no credentials (per-song metadata via spotDL's no-credentials client).
[tasks."download:spotify"]
description = "Download a Spotify track or playlist into library/Spotify/"
hide = true
usage = 'arg "<url>"'
depends = ["library", { task = "spotify:list", args = ["{{ usage.url }}"] }]
run = 'spotify-downloader download "{{ vars.spotify_list }}" --no-cache --print-errors --output "{{ vars.spotify_output }}"'

[tasks."download:web"]
description = "Download a SoundCloud/YouTube/other track or playlist as MP3 into library/<Site>/"
hide = true
usage = 'arg "<url>"'
depends = ["library"]
run = '''
yt-dlp -x --audio-format mp3 --audio-quality 0 --embed-thumbnail --embed-metadata --windows-filenames \
  -o "library/%(extractor_key)s/%(playlist_title|)s/%(uploader)s - %(title)s [%(id)s].%(ext)s" \
  "$usage_url"
'''

# Liked Songs ("Saved tracks") + all your playlists, including private ones. Existing files are skipped; nothing is deleted.
[tasks.sync]
description = "Download new tracks from Liked Songs and all your playlists into library/Spotify/"
depends = ["library", "spotify:list saved all-user-playlists"]
run = 'spotify-downloader download "{{ vars.spotify_list }}" --no-cache --print-errors --output "{{ vars.spotify_output }}"'

# Two-way sync library/ <-> the Snowsky card's Music/. bisync state lives on the card in bisync/
# (not a dot-folder: Disco's scanner stops pruning vanished songs when it meets one).
[tasks.snowsky-sync]
description = "Two-way sync library/ with the Snowsky SD card's Music/ (rclone bisync)"
usage = '''
flag "--resync" help="First run, or after changing .rclone-filters"
flag "--dry-run" help="Show what would change; copy and delete nothing"
'''
depends = ["library", "snowsky:mount"]
depends_post = ["snowsky:unmount"]
run = '''
rclone bisync library/ "{{ vars.snowsky_root }}/Music" \
  --workdir "{{ vars.snowsky_root }}/bisync" \
  --filters-file .rclone-filters \
  --modify-window 2s \
  --resilient --recover --max-lock 2m \
  --progress{% if usage.resync %} --resync{% endif %}{% if usage.dry_run %} --dry-run{% endif %}
'''

[tasks."snowsky:mount"]
description = "Mount the Snowsky SD card"
hide = true
skip_if = "diskutil info {{ vars.snowsky_uuid }} | grep -Eq 'Mounted: +Yes'"
run = "diskutil mount {{ vars.snowsky_uuid }}"

# macOS recreates these dot-folders on every mount; each one stops Disco pruning vanished songs.
[tasks."snowsky:unmount"]
description = "Remove macOS dot-folders from the Snowsky card, then unmount it"
hide = true
confirm = "Unmount the Snowsky card?"
run = [
  'rm -rf "{{ vars.snowsky_root }}/.Spotlight-V100" "{{ vars.snowsky_root }}/.Trashes" "{{ vars.snowsky_root }}/.fseventsd"',
  "diskutil unmount {{ vars.snowsky_uuid }}",
]

# The sdl TUI (see .fleet/docs/SPEC-tui.md). The [tools] above put yt-dlp, ffmpeg and deno on PATH.
[tasks.tui]
description = "Run the sdl TUI: sync Spotify, download a link, sync the Snowsky card"
interactive = true
run = "target/release/sdl"
