[package]
name = "sdl-youtube"
description = "YouTube Music matching, link listing and yt-dlp downloading for sdl"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
sdl-core.workspace = true
innertube-rs.workspace = true
strsim.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
# Killing a process group (yt-dlp and everything it started) without `unsafe`.
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
