[package]
name = "sdl"
description = "Terminal UI: Spotify to library to Snowsky card"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
sdl-core.workspace = true
sdl-tasks.workspace = true
sdl-form.workspace = true
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
crossterm = { workspace = true, features = ["event-stream", "bracketed-paste"] }
catppuccin.workspace = true
tui-popup.workspace = true
tui-scrollview.workspace = true
tui-scrollbar.workspace = true
tachyonfx.workspace = true
open.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "sync", "time", "process"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
color-eyre.workspace = true
futures.workspace = true
