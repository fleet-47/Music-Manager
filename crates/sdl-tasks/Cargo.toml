[package]
name = "sdl-tasks"
description = "The runner and the five functions' tasks for sdl; the only writer of the settings files"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
sdl-core.workspace = true
sdl-spotify.workspace = true
sdl-youtube.workspace = true
sdl-library.workspace = true
sdl-devices.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
