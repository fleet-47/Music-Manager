[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
sdl-core = { path = "crates/sdl-core" }
sdl-spotify = { path = "crates/sdl-spotify" }
sdl-youtube = { path = "crates/sdl-youtube" }
sdl-library = { path = "crates/sdl-library" }
sdl-devices = { path = "crates/sdl-devices" }
sdl-tasks = { path = "crates/sdl-tasks" }
sdl-form = { path = "crates/sdl-form" }

rspotify = "0.16.1"
innertube-rs = "0.12.0"
catppuccin = { version = "2.9.1", features = ["ratatui"] }
throbber-widgets-tui = "0.11.1"
httpdate = "1.0.3"
musicbrainz_rs = { version = "0.14.0", features = ["async", "rate_limit", "rustls"] }
lofty = "0.25.5"
ratatui = "0.30.2"
crossterm = "0.29.0"
tui-input = "0.15.5"
tokio = "1.54.1"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
thiserror = "2.0.21"
color-eyre = "0.6.5"
directories = "6.0.0"
strsim = "0.11.1"
sanitize-filename = "0.6.0"
walkdir = "2.5.0"
plist = "1.10.1"
open = "5.4.5"
futures = "0.3.34"
url = "2.5.8"
tempfile = "3.27.0"
atomic-write-file = "0.3.1"
tokio-util = "0.7.20"
which = "8.0.6"
# Killing a process group (a tool and everything it started) without `unsafe`.
rustix = { version = "1.1", features = ["process"] }
serde_json = "1.0.154"
keyring = "4.2.0"
notify = "8.2.2"
tui-popup = "0.7.7"
tui-scrollview = "0.6.8"
tui-scrollbar = { version = "0.2.8", features = ["crossterm"] }
nucleo-matcher = "0.3.1"
ratatui-explorer = "0.3.0"
tachyonfx = { version = "0.25.2", default-features = false, features = ["std"] }
